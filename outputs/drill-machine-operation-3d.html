<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ドリルマシン 3D工程再現</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
      background: #071014;
      color: #edf8fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 50% 8%, rgba(37, 120, 137, .2), transparent 38%),
        #071014;
    }
    main {
      width: min(1320px, 100%);
      margin: 0 auto;
      padding: 18px;
    }
    .heading-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0;
      font-size: clamp(20px, 2.2vw, 32px);
      line-height: 1.2;
      letter-spacing: .02em;
    }
    .subtitle {
      margin: 5px 0 0;
      color: #a7c3ca;
      font-size: 13px;
    }
    .contract {
      color: #8dd8e8;
      font-size: 12px;
      text-align: right;
      white-space: nowrap;
    }
    .stage-shell {
      overflow: hidden;
      border: 1px solid rgba(133, 211, 226, .35);
      border-radius: 16px;
      background: #071014;
      box-shadow: 0 22px 70px rgba(0, 0, 0, .35);
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: #071014;
    }
    .controls {
      display: grid;
      grid-template-columns: auto auto minmax(180px, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid rgba(133, 211, 226, .22);
      background: rgba(8, 22, 27, .94);
    }
    button {
      min-height: 42px;
      padding: 0 17px;
      border: 1px solid #3b8da0;
      border-radius: 9px;
      background: #0b2931;
      color: #f1fbfd;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #103942; }
    button:focus-visible { outline: 3px solid #8de5f4; outline-offset: 2px; }
    button.primary {
      border-color: #6be1f3;
      background: #12667a;
    }
    button:disabled { opacity: .55; cursor: wait; }
    input[type="range"] { width: 100%; accent-color: #64d9ed; }
    .time {
      min-width: 102px;
      color: #c9e6eb;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .export-note {
      min-height: 22px;
      margin: 10px 2px 0;
      color: #9fc0c7;
      font-size: 12px;
    }
    @media (max-width: 720px) {
      main { padding: 10px; }
      .heading-row { align-items: start; flex-direction: column; }
      .contract { text-align: left; white-space: normal; }
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .controls input, .controls .time { grid-column: 1 / -1; }
      button { width: 100%; padding-inline: 10px; }
      .time { text-align: left; }
    }
  </style>
</head>
<body>
  <main>
    <div class="heading-row">
      <div>
        <h1>ドリルマシン 3D工程再現</h1>
        <p class="subtitle">固定ドリルと、平面移動・独立2軸回転するボール台座</p>
      </div>
      <div class="contract">基準回転 → 平面移動 → F・R / サイド調整 → 掘削</div>
    </div>

    <section class="stage-shell" aria-label="ドリルマシン3D工程動画">
      <canvas id="stage" width="1280" height="720"></canvas>
      <div class="controls">
        <button id="restartButton" type="button">最初から</button>
        <button id="playButton" class="primary" type="button">一時停止</button>
        <input id="timeline" type="range" min="0" max="1" step="0.001" value="0" aria-label="動画の再生位置" />
        <button id="exportButton" type="button">WebMを書き出す</button>
        <output id="timeOutput" class="time">0:00 / 0:24</output>
      </div>
    </section>
    <p id="exportNote" class="export-note">動画は無音です。工程名・ピッチ値・機構の動きを画面内に表示します。</p>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d", { alpha: false });
      const playButton = document.getElementById("playButton");
      const restartButton = document.getElementById("restartButton");
      const exportButton = document.getElementById("exportButton");
      const timeline = document.getElementById("timeline");
      const timeOutput = document.getElementById("timeOutput");
      const exportNote = document.getElementById("exportNote");

      const W = 1280;
      const H = 720;
      const TAU = Math.PI * 2;
      const BALL_RADIUS = 2.15;
      const PIVOT_Y = 0.92;
      const CENTER_OFFSET = [0, 2.62, 0];
      const UP = [0, 1, 0];

      const C = {
        bg0: "#071014",
        bg1: "#0b2026",
        grid: "rgba(113, 183, 196, .13)",
        metal: "#687981",
        metalLight: "#a9bac0",
        metalDark: "#35464d",
        bed: "#263c42",
        moving: "#31535c",
        ring: "#87a4aa",
        ball0: "#177b90",
        ball1: "#073c4d",
        ball2: "#021d28",
        cyan: "#65dced",
        blue: "#69aefa",
        orange: "#f0a05b",
        red: "#ff4d55",
        yellow: "#f1d05f",
        green: "#72d69d",
        white: "#edf8fb",
        muted: "#9ebcc3",
        dark: "rgba(3, 10, 13, .82)"
      };

      const holes = [
        { id: "middle", name: "中指", local: spherePoint(-0.60, 1.43), side: -0.125, fr: 0.250, color: C.blue },
        { id: "ring", name: "薬指", local: spherePoint(0.62, 1.38), side: 0.0625, fr: -0.125, color: "#f37da8" },
        { id: "thumb", name: "サム", local: spherePoint(0, -1.77), side: 0.125, fr: -0.250, color: C.yellow }
      ];
      const gripCenter = [0, BALL_RADIUS, 0];

      const cycleDurations = {
        rotate: 1.30,
        translate: 1.00,
        pitch: 1.10,
        lock: 0.38,
        drill: 1.45,
        retract: 1.02,
        return: 1.15
      };
      const introDuration = 1.15;
      const outroDuration = 1.05;
      const cycleDuration = Object.values(cycleDurations).reduce((a, b) => a + b, 0);
      const totalDuration = introDuration + holes.length * cycleDuration + outroDuration;

      const phases = buildPhases();
      let elapsed = 0;
      let playing = true;
      let lastNow = performance.now();
      let exporting = false;
      let recorder = null;
      let recordedChunks = [];

      const camera = createCamera([10.5, 7.9, 13.5], [0, 3.25, 0], 920);
      let items = [];

      function spherePoint(side, longitudinal) {
        const y = Math.sqrt(Math.max(0, BALL_RADIUS ** 2 - side ** 2 - longitudinal ** 2));
        return [side, y, longitudinal];
      }

      function vAdd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
      function vSub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
      function vScale(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
      function vDot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
      function vCross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
      function vLength(a) { return Math.hypot(a[0], a[1], a[2]); }
      function vNorm(a) { const l = vLength(a) || 1; return vScale(a, 1 / l); }
      function vLerp(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
      function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function ease(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

      function qIdentity() { return [0, 0, 0, 1]; }
      function qAxis(axis, angle) {
        const n = vNorm(axis);
        const s = Math.sin(angle / 2);
        return [n[0] * s, n[1] * s, n[2] * s, Math.cos(angle / 2)];
      }
      function qMul(a, b) {
        return [
          a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
          a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
          a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
          a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2]
        ];
      }
      function qNorm(q) {
        const l = Math.hypot(...q) || 1;
        return q.map((n) => n / l);
      }
      function qRotate(q, p) {
        const u = [q[0], q[1], q[2]];
        const s = q[3];
        return vAdd(vAdd(vScale(u, 2 * vDot(u, p)), vScale(p, s * s - vDot(u, u))), vScale(vCross(u, p), 2 * s));
      }
      function qFromTo(from, to) {
        const a = vNorm(from);
        const b = vNorm(to);
        const d = clamp(vDot(a, b), -1, 1);
        if (d > 0.999999) return qIdentity();
        if (d < -0.999999) {
          const axis = Math.abs(a[0]) < 0.8 ? vCross(a, [1, 0, 0]) : vCross(a, [0, 0, 1]);
          return qAxis(axis, Math.PI);
        }
        const c = vCross(a, b);
        return qNorm([c[0], c[1], c[2], 1 + d]);
      }
      function qSlerp(a, b, t) {
        let bb = b.slice();
        let cos = a[0] * bb[0] + a[1] * bb[1] + a[2] * bb[2] + a[3] * bb[3];
        if (cos < 0) { bb = bb.map((n) => -n); cos = -cos; }
        if (cos > 0.9995) return qNorm(a.map((n, i) => lerp(n, bb[i], t)));
        const theta = Math.acos(clamp(cos, -1, 1));
        const sin = Math.sin(theta);
        const wa = Math.sin((1 - t) * theta) / sin;
        const wb = Math.sin(t * theta) / sin;
        return a.map((n, i) => n * wa + bb[i] * wb);
      }

      function holePose(hole) {
        const qLayout = qFromTo(hole.local, UP);
        const frAngle = Math.atan2(hole.fr, BALL_RADIUS);
        const sideAngle = Math.atan2(hole.side, BALL_RADIUS);
        const qFr = qAxis([1, 0, 0], -frAngle);
        const qSide = qAxis([0, 0, 1], sideAngle);
        const qFinal = qMul(qSide, qMul(qFr, qLayout));
        return { qLayout, qFinal, frAngle, sideAngle };
      }

      function rawPointForPose(localPoint, q) {
        return vAdd([0, PIVOT_Y, 0], qRotate(q, vAdd(CENTER_OFFSET, localPoint)));
      }
      function alignmentTranslation(localPoint, q) {
        const raw = rawPointForPose(localPoint, q);
        return [-raw[0], 0, -raw[2]];
      }

      function buildPhases() {
        const result = [{ start: 0, end: introDuration, type: "intro", title: "グリップセンターで0合わせ", detail: "表面マーカーを固定ドリルの直下へ合わせます" }];
        let cursor = introDuration;
        holes.forEach((hole, index) => {
          [
            ["rotate", `${hole.name}：基準回転`, "グリップセンターからホールへ伸びる直線方向に回転"],
            ["translate", `${hole.name}：平面移動`, "回転後の開口マーカーをドリル直下へ移動"],
            ["pitch", `${hole.name}：独立2軸ピッチ調整`, "F・R軸とサイド軸を1/16インチ刻みで調整"],
            ["lock", `${hole.name}：台座を固定`, "位置と2軸の姿勢をロック"],
            ["drill", `${hole.name}：ドリル下降`, "固定されたドリル軸に沿って設定深さまで掘削"],
            ["retract", `${hole.name}：ドリル上昇`, "同じ直線軸のままドリルを戻します"],
            ["return", `${hole.name}：基準へ復帰`, "次のホールに備えてグリップセンター基準へ戻します"]
          ].forEach(([type, title, detail]) => {
            const duration = cycleDurations[type];
            result.push({ start: cursor, end: cursor + duration, type, title, detail, holeIndex: index });
            cursor += duration;
          });
        });
        result.push({ start: cursor, end: cursor + outroDuration, type: "outro", title: "3ホールの加工完了", detail: "ピッチ角度は深さから独立し、各ホールで一本の直線軸を維持" });
        return result;
      }

      function currentPhase(t) {
        return phases.find((phase) => t >= phase.start && t < phase.end) || phases[phases.length - 1];
      }

      function stateAt(t) {
        const phase = currentPhase(t);
        const phaseT = ease((t - phase.start) / Math.max(0.001, phase.end - phase.start));
        let q = qIdentity();
        let translation = [0, 0, 0];
        let activeHole = null;
        let frValue = 0;
        let sideValue = 0;
        let drillFactor = 0;
        const drilled = holes.map((_, index) => {
          const retract = phases.find((p) => p.holeIndex === index && p.type === "retract");
          return retract ? t >= retract.end : false;
        });

        if (phase.holeIndex != null) {
          activeHole = holes[phase.holeIndex];
          const pose = holePose(activeHole);
          const layoutTranslation = alignmentTranslation(activeHole.local, pose.qLayout);
          const finalTranslation = alignmentTranslation(activeHole.local, pose.qFinal);

          if (phase.type === "rotate") {
            q = qSlerp(qIdentity(), pose.qLayout, phaseT);
          } else if (phase.type === "translate") {
            q = pose.qLayout;
            translation = vLerp([0, 0, 0], layoutTranslation, phaseT);
          } else if (phase.type === "pitch") {
            q = qSlerp(pose.qLayout, pose.qFinal, phaseT);
            translation = alignmentTranslation(activeHole.local, q);
            frValue = activeHole.fr * phaseT;
            sideValue = activeHole.side * phaseT;
          } else if (["lock", "drill", "retract"].includes(phase.type)) {
            q = pose.qFinal;
            translation = finalTranslation;
            frValue = activeHole.fr;
            sideValue = activeHole.side;
            if (phase.type === "drill") drillFactor = phaseT;
            if (phase.type === "retract") drillFactor = 1 - phaseT;
          } else if (phase.type === "return") {
            q = qSlerp(pose.qFinal, qIdentity(), phaseT);
            translation = vLerp(finalTranslation, [0, 0, 0], phaseT);
            frValue = activeHole.fr * (1 - phaseT);
            sideValue = activeHole.side * (1 - phaseT);
          }
        }

        return { phase, phaseT, q, translation, activeHole, frValue, sideValue, drillFactor, drilled };
      }

      function createCamera(position, target, focal) {
        const forward = vNorm(vSub(target, position));
        const right = vNorm(vCross(forward, UP));
        const up = vNorm(vCross(right, forward));
        return { position, target, forward, right, up, focal };
      }
      function cameraPoint(p) {
        const d = vSub(p, camera.position);
        return { x: vDot(d, camera.right), y: vDot(d, camera.up), z: vDot(d, camera.forward) };
      }
      function project(p) {
        const q = cameraPoint(p);
        const z = Math.max(0.1, q.z);
        return { x: W * 0.53 + camera.focal * q.x / z, y: H * 0.55 - camera.focal * q.y / z, z: q.z };
      }
      function itemDepth(points) {
        return points.reduce((sum, point) => sum + cameraPoint(point).z, 0) / points.length;
      }
      function face(points, fill, stroke = "rgba(220,245,248,.18)", width = 1) {
        items.push({ depth: itemDepth(points), kind: "face", points, fill, stroke, width });
      }
      function line(points, stroke, width = 2, dash = null, depthBias = 0) {
        items.push({ depth: itemDepth(points) + depthBias, kind: "line", points, stroke, width, dash });
      }
      function circleItem(center, radius, draw, depthBias = 0) {
        items.push({ depth: cameraPoint(center).z + depthBias, kind: "custom", draw, center, radius });
      }
      function transformPoint(local, center, q = qIdentity()) { return vAdd(center, qRotate(q, local)); }

      function addBox(center, size, q, fill, edge = "rgba(225,247,250,.16)") {
        const [sx, sy, sz] = size.map((n) => n / 2);
        const local = [
          [-sx,-sy,-sz],[sx,-sy,-sz],[sx,sy,-sz],[-sx,sy,-sz],
          [-sx,-sy,sz],[sx,-sy,sz],[sx,sy,sz],[-sx,sy,sz]
        ];
        const p = local.map((point) => transformPoint(point, center, q));
        [[0,1,2,3],[4,7,6,5],[0,4,5,1],[3,2,6,7],[1,5,6,2],[0,3,7,4]]
          .forEach((f, index) => face(f.map((i) => p[i]), shade(fill, index), edge));
      }

      function shade(color, index) {
        if (!color.startsWith("#")) return color;
        const amount = [0.70, 1.08, 0.82, 1.16, 0.94, 0.76][index % 6];
        const r = clamp(parseInt(color.slice(1,3),16) * amount, 0, 255);
        const g = clamp(parseInt(color.slice(3,5),16) * amount, 0, 255);
        const b = clamp(parseInt(color.slice(5,7),16) * amount, 0, 255);
        return `rgb(${r|0} ${g|0} ${b|0})`;
      }

      function addCylinder(center, radius, height, q, fill, segments = 18) {
        const bottom = [];
        const top = [];
        for (let i = 0; i <= segments; i++) {
          const a = i / segments * TAU;
          bottom.push(transformPoint([Math.cos(a) * radius, -height / 2, Math.sin(a) * radius], center, q));
          top.push(transformPoint([Math.cos(a) * radius, height / 2, Math.sin(a) * radius], center, q));
        }
        for (let i = 0; i < segments; i++) face([bottom[i], bottom[i+1], top[i+1], top[i]], shade(fill, i % 6), "rgba(235,250,252,.13)", .7);
        face(top.slice(0, -1), shade(fill, 3), "rgba(235,250,252,.2)");
        face(bottom.slice(0, -1).reverse(), shade(fill, 0), "rgba(235,250,252,.12)");
      }

      function addCone(baseCenter, radius, height, q, fill, segments = 18) {
        const base = [];
        const tip = transformPoint([0, -height, 0], baseCenter, q);
        for (let i = 0; i <= segments; i++) {
          const a = i / segments * TAU;
          base.push(transformPoint([Math.cos(a) * radius, 0, Math.sin(a) * radius], baseCenter, q));
        }
        for (let i = 0; i < segments; i++) face([base[i], base[i+1], tip], shade(fill, i % 6), "rgba(235,250,252,.15)", .7);
      }

      function addRing(center, radius, q, plane, color, width = 4) {
        const points = [];
        for (let i = 0; i <= 72; i++) {
          const a = i / 72 * TAU;
          let local;
          if (plane === "xy") local = [Math.cos(a) * radius, Math.sin(a) * radius, 0];
          else if (plane === "yz") local = [0, Math.cos(a) * radius, Math.sin(a) * radius];
          else local = [Math.cos(a) * radius, 0, Math.sin(a) * radius];
          points.push(transformPoint(local, center, q));
        }
        for (let i = 0; i < points.length - 1; i++) line([points[i], points[i+1]], color, width, null, -0.02);
      }

      function drawItem(item) {
        if (item.kind === "custom") { item.draw(); return; }
        const projected = item.points.map(project);
        if (projected.some((p) => p.z <= 0)) return;
        ctx.save();
        ctx.beginPath();
        projected.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        if (item.kind === "face") {
          ctx.closePath();
          ctx.fillStyle = item.fill;
          ctx.strokeStyle = item.stroke;
          ctx.lineWidth = item.width;
          ctx.fill();
          ctx.stroke();
        } else {
          if (item.dash) ctx.setLineDash(item.dash);
          ctx.strokeStyle = item.stroke;
          ctx.lineWidth = item.width;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, H);
        gradient.addColorStop(0, C.bg1);
        gradient.addColorStop(.68, C.bg0);
        gradient.addColorStop(1, "#040b0e");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, W, H);
        ctx.save();
        ctx.strokeStyle = C.grid;
        ctx.lineWidth = 1;
        for (let x = -10; x <= 10; x++) lineNow([x, 0, -7], [x, 0, 8]);
        for (let z = -7; z <= 8; z++) lineNow([-10, 0, z], [10, 0, z]);
        ctx.restore();
      }

      function lineNow(a, b) {
        const p0 = project(a);
        const p1 = project(b);
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.stroke();
      }

      function ballWorldCenter(state) {
        return vAdd(vAdd(state.translation, [0, PIVOT_Y, 0]), qRotate(state.q, CENTER_OFFSET));
      }
      function ballSurfaceWorld(local, state) {
        return vAdd(ballWorldCenter(state), qRotate(state.q, local));
      }

      function addBall(state) {
        const center = ballWorldCenter(state);
        const projected = project(center);
        const radiusPx = camera.focal * BALL_RADIUS / projected.z;
        circleItem(center, BALL_RADIUS, () => {
          const g = ctx.createRadialGradient(projected.x - radiusPx * .34, projected.y - radiusPx * .38, radiusPx * .08, projected.x, projected.y, radiusPx);
          g.addColorStop(0, "#2ab2c3");
          g.addColorStop(.48, C.ball0);
          g.addColorStop(.83, C.ball1);
          g.addColorStop(1, C.ball2);
          ctx.save();
          ctx.beginPath();
          ctx.arc(projected.x, projected.y, radiusPx, 0, TAU);
          ctx.fillStyle = g;
          ctx.fill();
          ctx.strokeStyle = "rgba(165, 236, 247, .8)";
          ctx.lineWidth = 2.2;
          ctx.stroke();
          ctx.clip();
          drawBallGrid(state, center);
          ctx.restore();
        });

        addLayoutArc(gripCenter, holes[0].local, state, "rgba(132,226,241,.58)");
        addLayoutArc(gripCenter, holes[1].local, state, "rgba(132,226,241,.58)");
        addLayoutArc(gripCenter, holes[2].local, state, "rgba(132,226,241,.42)");
        addSurfaceMarker(gripCenter, state, C.red, "GC", state.activeHole == null);
        holes.forEach((hole, index) => addSurfaceMarker(hole.local, state, hole.color, hole.name, state.activeHole?.id === hole.id, state.drilled[index]));
      }

      function drawBallGrid(state, center) {
        ctx.save();
        ctx.strokeStyle = "rgba(210, 249, 253, .16)";
        ctx.lineWidth = 1;
        [-45,-20,0,20,45].forEach((lat) => {
          const pts = [];
          const r = Math.cos(lat * Math.PI / 180) * BALL_RADIUS;
          const y = Math.sin(lat * Math.PI / 180) * BALL_RADIUS;
          for (let i = 0; i <= 72; i++) {
            const a = i / 72 * TAU;
            pts.push(project(vAdd(center, qRotate(state.q, [Math.cos(a) * r, y, Math.sin(a) * r]))));
          }
          ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y)); ctx.stroke();
        });
        [-60,-30,0,30,60].forEach((lon) => {
          const pts = [];
          const a = lon * Math.PI / 180;
          for (let i = -36; i <= 36; i++) {
            const b = i / 36 * Math.PI / 2;
            pts.push(project(vAdd(center, qRotate(state.q, [Math.sin(a) * Math.cos(b) * BALL_RADIUS, Math.sin(b) * BALL_RADIUS, Math.cos(a) * Math.cos(b) * BALL_RADIUS]))));
          }
          ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y)); ctx.stroke();
        });
        ctx.restore();
      }

      function slerpVector(a, b, t) {
        const na = vNorm(a), nb = vNorm(b);
        const angle = Math.acos(clamp(vDot(na, nb), -1, 1));
        if (angle < 0.0001) return vScale(na, BALL_RADIUS);
        const s = Math.sin(angle);
        return vScale(vAdd(vScale(na, Math.sin((1-t)*angle)/s), vScale(nb, Math.sin(t*angle)/s)), BALL_RADIUS);
      }

      function addLayoutArc(a, b, state, color) {
        const points = [];
        for (let i = 0; i <= 32; i++) points.push(ballSurfaceWorld(slerpVector(a, b, i / 32), state));
        line(points, color, 1.5, [5,4], -0.15);
      }

      function addSurfaceMarker(local, state, color, label, active, drilled = false) {
        const world = ballSurfaceWorld(local, state);
        const normal = vNorm(qRotate(state.q, local));
        const toCamera = vNorm(vSub(camera.position, world));
        if (vDot(normal, toCamera) < -.08) return;
        const p = project(world);
        const r = active ? 10 : 7;
        circleItem(world, .05, () => {
          ctx.save();
          ctx.fillStyle = drilled ? "#031116" : color;
          ctx.strokeStyle = active ? C.white : "rgba(3,12,15,.9)";
          ctx.lineWidth = active ? 3 : 2;
          ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU); ctx.fill(); ctx.stroke();
          if (drilled) { ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x,p.y,r+3,0,TAU); ctx.stroke(); }
          ctx.font = active ? "700 15px Segoe UI, Yu Gothic UI, sans-serif" : "700 12px Segoe UI, Yu Gothic UI, sans-serif";
          const width = ctx.measureText(label).width + 14;
          ctx.fillStyle = "rgba(2,10,13,.84)";
          roundRectPath(p.x + 12, p.y - 12, width, 24, 7); ctx.fill();
          ctx.fillStyle = color; ctx.textBaseline = "middle"; ctx.fillText(label, p.x + 19, p.y);
          ctx.restore();
        }, -0.45);
      }

      function addMachine(state) {
        addBox([0, .18, .15], [9.6, .36, 6.4], qIdentity(), C.bed);
        addBox([0, .53, .15], [7.4, .34, 5.2], qIdentity(), C.moving);
        addBox([state.translation[0], .76, state.translation[2]], [5.7, .30, 4.5], qIdentity(), "#41646c");
        addCylinder(vAdd(state.translation, [0, PIVOT_Y, 0]), 1.08, .30, qIdentity(), C.metalDark, 22);

        const pivot = vAdd(state.translation, [0, PIVOT_Y, 0]);
        const qFrVisual = state.activeHole ? qAxis([1,0,0], -Math.atan2(state.frValue, BALL_RADIUS)) : qIdentity();
        addRing(vAdd(pivot, qRotate(qFrVisual, CENTER_OFFSET)), 2.72, qFrVisual, "yz", "rgba(139,171,179,.72)", 5);
        addRing(ballWorldCenter(state), 2.52, state.q, "xy", "rgba(102,151,162,.82)", 5);

        addLever(state, "fr");
        addLever(state, "side");

        addBox([-5.2, 4.20, -1.45], [1.25, 8.4, 1.35], qIdentity(), C.metalDark);
        addBox([-2.65, 8.10, -1.08], [6.25, 1.48, 2.15], qIdentity(), C.metal);
        addBox([-0.35, 7.12, -.45], [1.35, 1.52, 1.28], qIdentity(), C.metalLight);

        const contactY = state.activeHole ? ballSurfaceWorld(state.activeHole.local, state)[1] : ballSurfaceWorld(gripCenter, state)[1];
        const restTip = 6.68;
        const drillTip = lerp(restTip, contactY - 1.18, state.drillFactor);
        addCylinder([0, drillTip + 1.42, 0], .25, 2.34, qIdentity(), "#b7c6cb", 18);
        addCylinder([0, drillTip + .35, 0], .15, .86, qIdentity(), "#d6e2e5", 18);
        addCone([0, drillTip - .08, 0], .15, .35, qIdentity(), "#e7f0f2", 18);
        if (state.drillFactor > .03) {
          for (let i = 0; i < 5; i++) {
            const a = elapsed * 10 + i / 5 * TAU;
            line([[Math.cos(a)*.26, drillTip+.35+i*.11, Math.sin(a)*.26], [Math.cos(a+.8)*.26, drillTip+.46+i*.11, Math.sin(a+.8)*.26]], "rgba(104,220,237,.72)", 1.5, null, -1);
          }
        }

        if (state.activeHole && ["pitch","lock","drill","retract"].includes(state.phase.type)) addAxisGuides(state);
      }

      function addLever(state, type) {
        const isFr = type === "fr";
        const value = isFr ? state.frValue : state.sideValue;
        const max = .5;
        const angle = value / max * .62;
        const base = isFr ? vAdd(state.translation, [2.9,.92,2.25]) : vAdd(state.translation, [-3.05,.95,.85]);
        const dir = isFr ? [Math.cos(angle), .36 + Math.sin(angle), .18] : [-.16, .35 + Math.sin(angle), Math.cos(angle)];
        const end = vAdd(base, vScale(vNorm(dir), 1.65));
        const mid = vLerp(base, end, .5);
        const axis = vNorm(vSub(end, base));
        const q = qFromTo([0,1,0], axis);
        addCylinder(mid, .085, vLength(vSub(end,base)), q, "#a9b7bb", 12);
        addCylinder(end, .22, .34, q, C.red, 14);
      }

      function addAxisGuides(state) {
        const p = ballSurfaceWorld(state.activeHole.local, state);
        const center = ballWorldCenter(state);
        const inward = vNorm(vSub(center, p));
        line([p, vAdd(p, vScale(inward, 2.75))], "rgba(101,220,237,.75)", 2, [7,5], -1.1);
        line([p, vAdd(p, [0,-2.75,0])], "rgba(241,208,95,.92)", 3, null, -1.2);
      }

      function drawScene(state) {
        drawBackground();
        items = [];
        addMachine(state);
        addBall(state);
        items.sort((a, b) => b.depth - a.depth).forEach(drawItem);
        drawOverlay(state);
      }

      function drawOverlay(state) {
        const phase = state.phase;
        ctx.save();
        ctx.fillStyle = "rgba(2,10,13,.84)";
        roundRectPath(28, 24, 570, 104, 14); ctx.fill();
        ctx.strokeStyle = "rgba(101,220,237,.42)"; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = C.cyan; ctx.font = "700 14px Segoe UI, Yu Gothic UI, sans-serif";
        ctx.fillText(`工程 ${Math.min(phases.indexOf(phase)+1, phases.length)} / ${phases.length}`, 48, 50);
        ctx.fillStyle = C.white; ctx.font = "700 27px Segoe UI, Yu Gothic UI, sans-serif";
        ctx.fillText(phase.title, 48, 82);
        ctx.fillStyle = C.muted; ctx.font = "15px Segoe UI, Yu Gothic UI, sans-serif";
        ctx.fillText(phase.detail, 48, 111);

        drawPitchPanel(state);
        drawTimeline(state);
        ctx.restore();
      }

      function drawPitchPanel(state) {
        const x = 932, y = 24, w = 320, h = 150;
        ctx.fillStyle = "rgba(2,10,13,.84)"; roundRectPath(x,y,w,h,14); ctx.fill();
        ctx.strokeStyle = "rgba(101,220,237,.42)"; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = C.white; ctx.font = "700 16px Segoe UI, Yu Gothic UI, sans-serif";
        ctx.fillText(state.activeHole ? `${state.activeHole.name} ピッチ` : "独立2軸ピッチ", x+18, y+27);
        drawGauge(x+18, y+48, w-36, "F・R", state.frValue, C.orange, (v) => v >= 0 ? `F ${formatInch(v)}` : `R ${formatInch(-v)}`);
        drawGauge(x+18, y+100, w-36, "サイド", state.sideValue, C.blue, (v) => v >= 0 ? `右 ${formatInch(v)}` : `左 ${formatInch(-v)}`);
      }

      function drawGauge(x, y, width, label, value, color, formatter) {
        ctx.fillStyle = C.muted; ctx.font = "12px Segoe UI, Yu Gothic UI, sans-serif"; ctx.fillText(label, x, y);
        ctx.fillStyle = C.white; ctx.font = "700 13px Segoe UI, Yu Gothic UI, sans-serif"; ctx.textAlign = "right"; ctx.fillText(Math.abs(value) < 1/128 ? "0" : formatter(value), x+width, y); ctx.textAlign = "left";
        const gy = y + 18;
        ctx.strokeStyle = "rgba(190,229,235,.35)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x,gy); ctx.lineTo(x+width,gy); ctx.stroke();
        for (let i=-8;i<=8;i++) { const tx=x+width*(i+8)/16; const th=i%4===0?8:4; ctx.beginPath();ctx.moveTo(tx,gy-th);ctx.lineTo(tx,gy+th);ctx.stroke(); }
        const marker = x + width * clamp((value + .5) / 1, 0, 1);
        ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(marker,gy-11);ctx.lineTo(marker-7,gy-20);ctx.lineTo(marker+7,gy-20);ctx.closePath();ctx.fill();
      }

      function drawTimeline(state) {
        const x = 34, y = H - 44, width = W - 68;
        ctx.strokeStyle = "rgba(183,224,231,.24)"; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+width,y);ctx.stroke();
        const progress = clamp(elapsed / totalDuration, 0, 1);
        ctx.strokeStyle = C.cyan; ctx.lineWidth = 6; ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+width*progress,y);ctx.stroke();
        phases.forEach((phase) => {
          const px = x + width * phase.start / totalDuration;
          ctx.fillStyle = phase.holeIndex == null ? C.white : holes[phase.holeIndex].color;
          ctx.beginPath();ctx.arc(px,y,phase.type === "rotate" ? 5 : 2.7,0,TAU);ctx.fill();
        });
        ctx.fillStyle = C.muted; ctx.font = "12px Segoe UI, Yu Gothic UI, sans-serif";
        ctx.fillText("GC", x, y-14);
        holes.forEach((hole, i) => {
          const phase = phases.find((p) => p.holeIndex === i && p.type === "rotate");
          ctx.fillStyle = hole.color; ctx.fillText(hole.name, x + width*phase.start/totalDuration + 8, y-14);
        });
      }

      function formatInch(value) {
        const sign = value < 0 ? "-" : "";
        const n = Math.round(Math.abs(value) * 16);
        if (!n) return "0";
        const whole = Math.floor(n / 16);
        let numerator = n % 16;
        if (!numerator) return `${sign}${whole}\"`;
        let denominator = 16;
        while (numerator % 2 === 0) { numerator /= 2; denominator /= 2; }
        return `${sign}${whole ? whole + " " : ""}${numerator}/${denominator}\"`;
      }

      function formatTime(seconds) {
        const s = Math.max(0, Math.round(seconds));
        return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
      }

      function roundRectPath(x, y, w, h, r) {
        const rr = Math.min(r, w/2, h/2);
        ctx.beginPath();
        ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath();
      }

      function tick(now) {
        const delta = Math.min(.08, Math.max(0, (now - lastNow) / 1000));
        lastNow = now;
        if (playing) {
          elapsed += delta;
          if (elapsed >= totalDuration) {
            elapsed = totalDuration;
            playing = false;
            playButton.textContent = "再生";
            if (exporting && recorder?.state === "recording") recorder.stop();
          }
        }
        drawScene(stateAt(elapsed));
        timeline.value = String(elapsed / totalDuration);
        timeOutput.textContent = `${formatTime(elapsed)} / ${formatTime(totalDuration)}`;
        requestAnimationFrame(tick);
      }

      playButton.addEventListener("click", () => {
        if (elapsed >= totalDuration) elapsed = 0;
        playing = !playing;
        playButton.textContent = playing ? "一時停止" : "再生";
        lastNow = performance.now();
      });
      restartButton.addEventListener("click", () => {
        elapsed = 0; playing = true; playButton.textContent = "一時停止"; lastNow = performance.now();
      });
      timeline.addEventListener("input", () => {
        elapsed = Number(timeline.value) * totalDuration;
        playing = false; playButton.textContent = "再生";
      });

      exportButton.addEventListener("click", exportVideo);

      function exportVideo() {
        if (exporting || typeof MediaRecorder === "undefined") return;
        const mimeTypes = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
        const mimeType = mimeTypes.find((type) => MediaRecorder.isTypeSupported(type)) || "video/webm";
        const stream = canvas.captureStream(30);
        recordedChunks = [];
        recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 7000000 });
        recorder.ondataavailable = (event) => { if (event.data?.size) recordedChunks.push(event.data); };
        recorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: mimeType });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "drill-machine-operation-3d.webm";
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
          exporting = false;
          exportButton.disabled = false;
          exportButton.textContent = "WebMを書き出す";
          exportNote.textContent = "動画の書き出しが完了しました。";
        };
        exporting = true;
        exportButton.disabled = true;
        exportButton.textContent = "書き出し中…";
        exportNote.textContent = `約${Math.ceil(totalDuration)}秒の動画を実時間で記録しています。`;
        elapsed = 0;
        playing = true;
        playButton.textContent = "一時停止";
        lastNow = performance.now();
        recorder.start(250);
      }

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
